name: Behavior Spec Check

on: [push, pull_request]

jobs:
  pecto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install pecto
        run: cargo install --git https://github.com/AliciaMartinelli/pecto pecto

      - name: Verify behavior spec
        run: pecto verify specs.yaml
