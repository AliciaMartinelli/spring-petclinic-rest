name: Behavior Spec Check

on: [push, pull_request]

jobs:
  pecto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install pecto
        run: cargo install --git https://github.com/AliciaMartinelli/pecto pecto

      - name: Verify behavior spec
        id: verify
        continue-on-error: true
        run: |
          pecto verify specs.yaml 2>&1 | sed 's/\x1b\[[0-9;]*m//g' | tee /tmp/pecto-output.txt
          echo "EXIT_CODE=${PIPESTATUS[0]}" >> $GITHUB_ENV

      - name: Post drift summary
        if: env.EXIT_CODE == '1'
        run: |
          echo "## Behavior Drift Detected" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "The code has changed in ways that don't match the committed spec." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```diff' >> $GITHUB_STEP_SUMMARY
          # Show lines starting with - or + (drift additions/removals)
          grep -E '^\-|^\+' /tmp/pecto-output.txt | head -60 >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Fix:** Run \`pecto init . --output specs.yaml\` locally and commit the updated spec." >> $GITHUB_STEP_SUMMARY

      - name: Post success summary
        if: env.EXIT_CODE != '1'
        run: |
          echo "## Behavior Spec: No Drift" >> $GITHUB_STEP_SUMMARY
          echo "Code matches the committed spec." >> $GITHUB_STEP_SUMMARY

      - name: Fail if drift detected
        if: env.EXIT_CODE == '1'
        run: exit 1
